<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <div id="header-placeholder"></div>

        <div class="bg-white text-black flex-grow flex flex-col font-sans">
            <div class="p-8 md:p-12 border-b border-black bg-black text-white">
                <h1 class="text-[50px] md:text-[100px] font-extrabold uppercase leading-[0.8] tracking-tighter">
                    Get in <br>
                    <span class="italic font-serif font-normal lowercase tracking-normal text-gray-400">Touch</span>
                </h1>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 flex-grow">
                <div class="md:col-span-4 p-8 md:p-12 border-r border-black flex flex-col justify-between bg-white">
                    <div>
                        <h2 class="text-2xl font-extrabold uppercase mb-6">Directe Lijnen.</h2>
                        <p class="font-serif italic text-lg text-gray-600 mb-8 leading-snug">
                            "Laten we bespreken wat de feiten voor uw organisatie betekenen."
                        </p>
                    </div>
                    <div class="space-y-6">
                        <div class="border-t border-black pt-4">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Email</span>
                            <p class="font-bold uppercase text-sm">info@hazystandard.nl</p>
                        </div>
                    </div>
                </div>
                <div class="md:col-span-8 p-8 md:p-16 bg-gray-50">
                    </div>
            </div>
        </div>
<head>
    <script>
        (function(w,d,e,u,f,l,n){w[f]=w[f]||function(){(w[f].q=w[f].q||[])
        .push(arguments);},l=d.createElement(e),l.async=1,l.src=u,
        n=d.getElementsByTagName(e)[0],n.parentNode.insertBefore(l,n);})
        (window,document,'script','https://assets.mailerlite.com/js/universal.js','ml');
        ml('account', '2457736');
    </script>
</head>
        <div id="footer-placeholder"></div>
    </div>

    <script>
        // Functie om bestanden in te laden
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
        });
    </script>
</body>
</html>
