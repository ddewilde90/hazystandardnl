<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdn.snipcart.com" />
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <header class="border-b border-black">
            <div class="flex justify-between items-center px-4 py-6 border-b border-black">
                <h1 class="text-4xl font-extrabold uppercase tracking-tighter"><a href="index.html">Hazy Standard.</a></h1>
                <a href="#" class="snipcart-checkout flex items-center space-x-2 text-xs font-bold uppercase tracking-widest border border-black px-3 py-2 hover:bg-black hover:text-white transition-all cursor-pointer">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Mandje (<span class="snipcart-items-count">0</span>)</span>
                </a>
            </div>
               <nav class="flex flex-wrap overflow-x-auto border-black">
    <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Home</a>
    <a href="verhalen.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Verhalen</a>
    <a href="about.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">About me</a>
    <a href="shop.html" class="bg-black text-white px-6 py-3 border-r border-black font-semibold uppercase text-sm">Shop</a>
    <a href="contact.html" class="px-6 py-3 border-black font-semibold uppercase text-sm">Contact</a>
</nav>
        </header>

                <div class="bg-white text-black min-h-screen flex flex-col font-sans">
            <div class="p-8 md:p-12 border-b border-black bg-black text-white">
                <h1 class="text-[50px] md:text-[100px] font-extrabold uppercase leading-[0.8] tracking-tighter">
                    Get in <br>
                    <span class="italic font-serif font-normal lowercase tracking-normal text-gray-400">Touch</span>
                </h1>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 flex-grow">
                <div class="md:col-span-4 p-8 md:p-12 border-r border-black flex flex-col justify-between bg-white">
                    <div>
                        <h2 class="text-2xl font-extrabold uppercase mb-6">Directe Lijnen.</h2>
                        <p class="font-serif italic text-lg text-gray-600 mb-8 leading-snug">
                            "Laten we bespreken wat de feiten voor uw organisatie betekenen."
                        </p>
                    </div>
                    <div class="space-y-6">
                        <div class="border-t border-black pt-4">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Email</span>
                            <p class="font-bold uppercase text-sm">info@hazystandard.nl</p>
                        </div>
                    </div>
                </div>
                <div class="md:col-span-8 p-8 md:p-16 bg-gray-50">
                    </div>
            </div>
        </div>


        <main class="flex-grow grid grid-cols-1 md:grid-cols-3" id="product-grid"></main>

        <div id="footer-placeholder"></div>
    </div>

    <script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="YzkwMTE0ZjgtNTg2Yi00ZDRiLWJmZjktYjZkNjg2OTAwOTJmNjM5MTY4NjIyNzM2NDU3MTA5" data-currency="eur"></div>

    <script>
        let allProducts = [];

        fetch('producten.json')
            .then(r => r.json())
            .then(data => {
                allProducts = data;
                initFilters(allProducts);
                renderProducts(allProducts);
                lucide.createIcons();
            });

        function initFilters(products) {
            const config = [
                { id: 'filter-cat', key: 'category' },
                { id: 'filter-mat', key: 'material' },
                { id: 'filter-color', key: 'color' }
            ];
            config.forEach(c => {
                const select = document.getElementById(c.id);
                const values = [...new Set(products.map(p => p[c.key]))];
                values.forEach(v => {
                    if(v && v !== "Geen") {
                        const opt = document.createElement('option');
                        opt.value = v; opt.textContent = v;
                        select.appendChild(opt);
                    }
                });
            });
        }

        function renderProducts(list) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = list.map(p => `
                <div class="border-r border-b border-black p-8 hover:bg-gray-50">
                    <a href="product.html?id=${p.id}">
                        <img src="${p.image}" class="w-full h-64 object-cover mb-4">
                        <h3 class="text-2xl font-black uppercase tracking-tighter">${p.title}</h3>
                    </a>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-black">€${p.price.toFixed(2).replace('.', ',')}</span>
                        <button class="snipcart-add-item bg-black text-white px-4 py-2 text-xs font-bold uppercase"
                            data-item-id="${p.id}" data-item-name="${p.title}" data-item-price="${p.price}"
                            data-item-url="https://ddewilde90.github.io/hazystandardnl/product.html?id=${p.id}">
                            + Mandje
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            let filtered = allProducts.filter(p => {
                const cat = document.getElementById('filter-cat').value;
                const mat = document.getElementById('filter-mat').value;
                const col = document.getElementById('filter-color').value;
                const max = parseFloat(document.getElementById('max-price').value) || Infinity;
                return (cat === 'all' || p.category === cat) &&
                       (mat === 'all' || p.material === mat) &&
                       (col === 'all' || p.color === col) &&
                       (p.price <= max);
            });
            const sort = document.getElementById('sort-price').value;
            if(sort === 'low-high') filtered.sort((a,b) => a.price - b.price);
            if(sort === 'high-low') filtered.sort((a,b) => b.price - a.price);
            renderProducts(filtered);
        }

        function resetFilters() {
            document.getElementById('filter-cat').value = 'all';
            document.getElementById('filter-mat').value = 'all';
            document.getElementById('filter-color').value = 'all';
            document.getElementById('max-price').value = '';
            document.getElementById('sort-price').value = 'none';
            renderProducts(allProducts);
        }

        ['filter-cat', 'filter-mat', 'filter-color', 'max-price', 'sort-price'].forEach(id => {
            document.getElementById(id).addEventListener('change', applyFilters);
        });

        fetch('footer.html').then(r => r.text()).then(d => {
            document.getElementById('footer-placeholder').innerHTML = d;
            lucide.createIcons();
        });
    </script>
</body>
</html>
