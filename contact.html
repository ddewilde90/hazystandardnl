<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <div id="header-placeholder"></div>

        <div class="bg-white text-black flex-grow flex flex-col font-sans">
            <!-- Hero Sectie met foto --->
            <div class="grid md:grid-cols-2 border-b border-black bg-black text-white">
                <div class="p-8 md:p-12 flex flex-col justify-center">
                    <h1 class="text-[50px] md:text-[80px] font-extrabold uppercase leading-[0.8] tracking-tighter">
                        Get in <br>
                        <span class="italic font-serif font-normal lowercase tracking-normal text-gray-400">Touch</span>
                    </h1>
                </div>
                <!-- Hier komt je foto -->
                <div class="h-64 md:h-auto overflow-hidden">
                    <img src="jouw-foto.jpg" alt="Daniëlle de Wilde" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 flex-grow">
                <!-- Linkerkolom: Contactgegevens -->
                <div class="md:col-span-4 p-8 md:p-12 border-r border-black flex flex-col justify-between bg-white">
                    <div>
                        <h2 class="text-2xl font-extrabold uppercase mb-6">Directe Lijnen.</h2>
                        <p class="font-serif italic text-lg text-gray-600 mb-8 leading-snug">
                            "Laten we bespreken wat de feiten voor uw organisatie betekenen."
                        </p>
                    </div>
                    <div class="space-y-6">
                        <div class="border-t border-black pt-4">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Email</span>
                            <p class="font-bold uppercase text-sm">info@hazystandard.nl</p>
                        </div>
                        <div class="border-t border-black pt-4">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Locatie</span>
                            <p class="font-bold uppercase text-sm">Grou, Friesland</p>
                        </div>
                    </div>
                </div>

                <!-- Rechterkolom: Formulier -->
                <div class="md:col-span-8 p-8 md:p-16 bg-gray-50">
                    <h3 class="text-3xl font-black uppercase tracking-tighter mb-8">Neem contact op</h3>
                    
                    <form action="https://formspree.io/f/xqevdqge" method="POST" class="space-y-4 mb-12">
                        <input type="text" name="naam" placeholder="Jouw Naam" required class="w-full p-3 border border-black focus:outline-none">
                        <input type="email" name="email" placeholder="Jouw Email" required class="w-full p-3 border border-black focus:outline-none">
                        <textarea name="bericht" rows="4" placeholder="Waar kan ik je mee helpen?" required class="w-full p-3 border border-black focus:outline-none"></textarea>
                        <button type="submit" class="bg-black text-white px-8 py-3 font-black uppercase text-sm hover:bg-gray-800 transition-all">Verstuur bericht</button>
                    </form>

                    <!-- Bedrijfsgegevens -->
                    <div class="pt-8 border-t border-gray-300">
                        <h4 class="font-black uppercase text-xs tracking-widest mb-4">Zakelijke gegevens</h4>
                        <div class="grid grid-cols-2 gap-4 text-sm font-medium text-gray-600">
                            <div>
                                <p class="text-[10px] uppercase font-bold text-gray-400">KvK Nummer</p>
                                <p>Vul hier je nummer in</p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase font-bold text-gray-400">BTW Nummer</p>
                                <p>Vul hier je nummer in</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>

    <script>
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
        }
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
        });
    </script>
</body>
</html>
