      <div id="footer-placeholder"></div>

<script>
    fetch('footer.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('footer-placeholder').innerHTML = data;
            // Nadat de footer geladen is, moet het MailerLite script opnieuw aangeroepen worden:
            ml('account', '2457736'); 
        });
</script>

    <script>
        // Functie om bestanden in te laden
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
        });
    </script>
   <script type="module">
        import { data } from './data.js';
        import * as app from './app.js';

        window.renderBlogGrid = () => {
            const grid = document.getElementById('blog-grid');
            if (grid && data.analysis) {
                grid.innerHTML = data.analysis.map(item => `
                    <article class="border border-black p-6 hover:bg-black hover:text-white transition-colors cursor-pointer group">
                        <img src="${item.image}" class="w-full h-48 object-cover mb-4 border border-black" alt="${item.title}">
                        <h3 class="text-xl font-black uppercase tracking-tighter mb-2 leading-tight">${item.title}</h3>
                        <p class="text-xs opacity-70 mb-4">${item.intro}</p>
                        <div class="mt-auto pt-4 border-t border-current flex justify-between items-center">
                            <span class="text-[9px] font-bold uppercase tracking-widest">${item.date}</span>
                            <span class="text-[9px] font-bold uppercase underline">Lees meer</span>
                        </div>
                    </article>
                `).join('');
            }
        };

         // Bridge functie om vanuit HTML bij de openArticle functie in apps.js te komen
        window.openArticleById = (id) => {
            const article = data.analysis.find(a => a.id === id);
            if (article) app.openArticle(article); 
        };

        // ZORG DAT DIT ER STAAT:
        // Omdat je waarschijnlijk in app.js de home-template laadt, 
        // moet je die daar aanroepen. Maar om het nu direct te testen:
        document.addEventListener('DOMContentLoaded', () => {
            // Eerst de home template laden (als je app.js dat nog niet doet)
            // Daarna het grid vullen:
            window.renderBlogGrid();
        });
    </script>
