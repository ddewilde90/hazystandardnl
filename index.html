<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Business Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-black font-sans antialiased"> 
    
    <header class="border-b border-black">
        <div class="flex flex-col md:flex-row justify-between items-center px-4 py-6 border-b border-black">
            <h1 class="text-4xl font-extrabold uppercase tracking-tighter"><a href="index.html">Hazy Standard.</a></h1>
            <a href="#" class="snipcart-checkout flex items-center space-x-2 text-xs font-bold uppercase tracking-widest border border-black px-3 py-2 hover:bg-black hover:text-white transition-all cursor-pointer">
                <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                <span>Mandje (<span class="snipcart-items-count">0</span>)</span>
            </a>
        </div>
        <nav class="flex flex-wrap overflow-x-auto border-black">
            <a href="index.html" class="bg-black text-white px-6 py-3 border-r border-black font-semibold uppercase text-sm">Home</a>
            <a href="verhalen.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Verhalen</a>
            <a href="about.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">About</a>
            <a href="shop.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Shop</a>
            <a href="contact.html" class="px-6 py-3 border-black font-semibold uppercase text-sm">Contact</a>
        </nav>
    </header>

    <main class="flex-grow p-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <div class="lg:col-span-3">
            <h2 class="text-xs font-black uppercase tracking-widest mb-8 border-b border-black pb-2">Recente Analyses</h2>
            <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <p>Artikelen laden...</p>
            </div>
        </div>

        <aside class="lg:col-span-1 border-l border-black pl-8">
            <h5 class="text-[10px] font-black uppercase mb-4 text-gray-400">Shop Highlights</h5>
            <div id="shop-sidebar-items" class="space-y-4">
                <p class="text-xs text-gray-500">Producten laden...</p>
            </div>
        </aside>

    </main>

    <div id="footer-placeholder"></div>

    <script type="module">
        import { data } from './data.js';

        async function init() {
            // Footer laden
            const footerRes = await fetch('footer.html');
            document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
            
            // 1. Blog Grid vullen
            const grid = document.getElementById('blog-grid');
            if (data && data.analysis && grid) {
                grid.innerHTML = data.analysis.map(item => `
                    <article class="border border-black p-6 hover:bg-black hover:text-white transition-colors flex flex-col group">
                        <img src="${item.image}" class="w-full h-48 object-cover mb-4 border border-black" alt="${item.title}">
                        <h3 class="text-xl font-black uppercase tracking-tighter mb-2 leading-tight">${item.title}</h3>
                        <p class="text-xs opacity-70 mb-4 flex-grow">${item.intro}</p>
                        <div class="mt-auto pt-4 border-t border-current flex justify-between items-center">
                            <span class="text-[9px] font-bold uppercase tracking-widest">${item.date}</span>
                            <a href="artikel.html?id=${item.id}" class="text-[9px] font-bold uppercase underline">Lees meer</a>
                        </div>
                    </article>
                `).join('');
            }

            // 2. Shop Sidebar vullen
            const shopRes = await fetch('producten.json');
            const producten = await shopRes.json();
            const sidebar = document.getElementById('shop-sidebar-items');
            sidebar.innerHTML = producten.slice(0, 3).map(p => `
                <a href="product.html?id=${p.id}" class="block group border border-black p-3 hover:bg-black transition-all">
                    <img src="${p.image}" class="w-full h-24 object-cover mb-2 border border-black">
                    <h6 class="text-xs font-bold uppercase text-black group-hover:text-white">${p.title}</h6>
                    <span class="text-[10px] font-bold text-gray-500 group-hover:text-gray-300">€${p.price.toFixed(2).replace('.', ',')}</span>
                </a>
            `).join('');

            if (window.lucide) lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

    <script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="YzkwMTE0ZjgtNTg2Yi00ZDRiLWJmZjktYjZkNjg2OTAwOTJmNjM5MTY4NjIyNzM2NDU3MTA5" data-currency="eur"></div>
</body>
</html>
