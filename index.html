<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Business Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdn.snipcart.com" />
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />

    <script>
        (function(w,d,e,u,f,l,n){w[f]=w[f]||function(){(w[f].q=w[f].q||[])
        .push(arguments);},l=d.createElement(e),l.async=1,l.src=u,
        n=d.getElementsByTagName(e)[0],n.parentNode.insertBefore(l,n);})
        (window,document,'script','https://assets.mailerlite.com/js/universal.js','ml');
        ml('account', '2457736');
    </script>
</head>
<body class="bg-white text-black font-sans antialiased">
    
    <header class="border-b border-black">
        <div class="flex flex-col md:flex-row justify-between items-center px-4 py-6 border-b border-black">
            <h1 class="text-4xl font-extrabold uppercase tracking-tighter mb-4 md:mb-0"><a href="index.html">Hazy Standard.</a></h1>
            <div class="flex items-center space-x-6">
                <a href="#" class="snipcart-checkout flex items-center space-x-2 text-xs font-bold uppercase tracking-widest border border-black px-3 py-2 hover:bg-black hover:text-white transition-all cursor-pointer">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Mandje (<span class="snipcart-items-count">0</span>)</span>
                </a>
            </div>
        </div>
        <nav class="flex flex-wrap overflow-x-auto border-black">
            <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Home</a>
            <a href="verhalen.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Verhalen</a>
            <a href="about.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">About me</a>
            <a href="shop.html" class="bg-black text-white px-6 py-3 border-r border-black font-semibold uppercase text-sm">Shop</a>
            <a href="contact.html" class="px-6 py-3 border-black font-semibold uppercase text-sm">Contact</a>
        </nav>
    </header>

    <main id="main-content" class="flex-grow p-8">
        <h2 class="text-xs font-black uppercase tracking-widest mb-8 border-b border-black pb-2">Recente Analyses</h2>
        <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module">
        import { data } from './data.js';
        import * as app from './app.js';

        // Globale functie voor artikel links
        window.openArticleById = (id) => {
            const article = data.analysis.find(a => a.id === id);
            if (article) app.openArticle(article);
            else console.error("Artikel niet gevonden:", id);
        };

        async function initPage() {
            // Header en Footer laden
            const [headerRes, footerRes] = await Promise.all([
                fetch('header.html'),
                fetch('footer.html')
            ]);
            
            // Note: Header staat al in de HTML, maar als je header.html ook wilt injecteren:
            // document.getElementById('header-placeholder').innerHTML = await headerRes.text();
            
            document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
            
            // MailerLite opnieuw triggeren in footer
            if (window.ml) ml('account', '2457736');

            // Blog grid vullen
            const grid = document.getElementById('blog-grid');
            if (grid && data.analysis) {
                grid.innerHTML = data.analysis.map(item => `
                    <article class="border border-black p-6 hover:bg-black hover:text-white transition-colors cursor-pointer group">
                        <img src="${item.image}" class="w-full h-48 object-cover mb-4 border border-black" alt="${item.title}">
                        <h3 class="text-xl font-black uppercase tracking-tighter mb-2 leading-tight">${item.title}</h3>
                        <p class="text-xs opacity-70 mb-4">${item.intro}</p>
                        <div class="mt-auto pt-4 border-t border-current flex justify-between items-center">
                            <span class="text-[9px] font-bold uppercase tracking-widest">${item.date}</span>
                            <button onclick="window.openArticleById('${item.id}')" class="text-[9px] font-bold uppercase underline">Lees meer</button>
                        </div>
                    </article>
                `).join('');
            }
            
            if (window.lucide) lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>

    <script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="YzkwMTE0ZjgtNTg2Yi00ZDRiLWJmZjktYjZkNjg2OTAwOTJmNjM5MTY4NjIyNzM2NDU3MTA5" data-currency="eur"></div>
</body>
</html>
