<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Hazy Standard | Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans">
    <main class="max-w-4xl mx-auto p-12">
        <a href="shop.html" class="text-xs font-bold uppercase underline mb-8 block">&larr; Terug naar Shop</a>
        
        <h1 id="product-title" class="text-5xl font-black uppercase tracking-tighter">Laden...</h1>
        <p id="product-desc" class="mt-6 text-lg"></p>
        <p id="product-price" class="text-2xl font-black mt-6"></p>
    </main>

    <script>
        // Een simpele database voor je producten
        const database = {
            "ocean-jasper-ring": {
                title: "Ocean Jasper Ring",
                price: "€1,00",
                desc: "Dit is een unieke, handgemaakte ring van ruwe Ocean Jasper."
            }
        };

        // Haal het ID uit de URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // Vul de pagina als het product bestaat
        const product = database[productId];
        if (product) {
            document.getElementById('product-title').innerText = product.title;
            document.getElementById('product-desc').innerText = product.desc;
            document.getElementById('product-price').innerText = product.price;
        } else {
            document.getElementById('product-title').innerText = "Product niet gevonden";
        }
    </script>
</body>
</html>
