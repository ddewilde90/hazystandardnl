<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10">
    <div id="product-container" class="max-w-2xl mx-auto">
        <h1 id="prod-title" class="text-4xl font-black uppercase">Laden...</h1>
        <p id="prod-desc" class="mt-4 text-lg"></p>
        <div id="prod-price" class="text-2xl font-bold mt-4"></div>
    </div>

    <script>
        // 1. Haal het ID uit de URL
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');

        // 2. Jouw productendatabase (dezelfde als in app.js)
        const producten = [
            { id: "ocean-jasper-ring", title: "Ocean Jasper Ring", price: "1.00", desc: "Dit is de unieke Ocean Jasper ring..." },
            // ... voeg hier je andere producten toe
        ];

        // 3. Zoek het product op en vul de pagina
        const product = producten.find(p => p.id === productId);
        if (product) {
            document.getElementById('prod-title').innerText = product.title;
            document.getElementById('prod-desc').innerText = product.desc;
            document.getElementById('prod-price').innerText = "€" + product.price;
        } else {
            document.getElementById('product-container').innerText = "Product niet gevonden.";
        }
    </script>
</body>
</html>
