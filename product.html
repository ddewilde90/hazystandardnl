<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Product Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <header class="border-b border-black">
            <div class="flex justify-between items-center px-4 py-6 border-b border-black">
                <h1 class="text-4xl font-extrabold uppercase tracking-tighter"><a href="index.html">Hazy Standard.</a></h1>
                <a href="#" class="snipcart-checkout flex items-center space-x-2 text-xs font-bold uppercase tracking-widest border border-black px-3 py-2 hover:bg-black hover:text-white transition-all cursor-pointer">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Mandje (<span class="snipcart-items-count">0</span>)</span>
                </a>
            </div>
            <nav class="flex overflow-x-auto border-black">
                <a href="shop.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm bg-black text-white">Shop</a>
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-50">Portfolio</a>
            </nav>
        </header>

        <main class="flex-grow p-8 md:p-12 grid grid-cols-1 md:grid-cols-2 gap-12">
            <div>
                <img id="prod-image" src="" class="w-full border border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
            </div>

            <div class="flex flex-col">
                <h1 id="prod-title" class="text-4xl font-black uppercase tracking-tighter">Laden...</h1>
                <div class="mt-6">
                    <span id="prod-price" class="text-3xl font-black">€0,00</span>
                    <p class="text-xs text-gray-400">Inclusief btw</p>
                </div>

                <button id="buy-button" class="mt-8 snipcart-add-item w-full bg-black text-white py-4 font-bold uppercase hover:bg-gray-800 transition-all">
                    Toevoegen aan mandje
                </button>

                <div class="mt-12 border-t border-black">
    <!-- Dropdown 1: Materiaal -->
    <div class="border-b border-black">
        <button onclick="toggleSection('specs-content')" class="w-full flex justify-between items-center py-4 font-bold uppercase hover:bg-gray-50">
            <span>Materiaal & Wasvoorschrift</span>
            <i data-lucide="chevron-down"></i>
        </button>
        <p id="specs-content" class="hidden py-4 text-sm text-gray-600 px-1"></p>
    </div>

    <!-- Dropdown 2: Alles over dit product -->
    <div class="border-b border-black">
        <button onclick="toggleSection('prod-content')" class="w-full flex justify-between items-center py-4 font-bold uppercase hover:bg-gray-50">
            <span>Alles over dit product</span>
            <i data-lucide="chevron-down"></i>
        </button>
        <p id="prod-content" class="hidden py-4 text-sm text-gray-600 px-1"></p>
    </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <script src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="JOUW_SNIPCART_API_KEY"></div>

    <script>
        // Database
        const producten = [
            {
                id: "ocean-jasper-ring",
                title: "Ocean Jasper Ring",
                price: 45.00,
                image: "/assets/images/ocean-jasper.jpg",
                specs: "Materiaal: 925 Sterling Zilver. Steen: Ocean Jasper.",
                content: "Dit is een uniek handgemaakt sieraad voor de moderne professional."
            }
        ];

        // Logica
        const params = new URLSearchParams(window.location.search);
        const p = producten.find(x => x.id === params.get('id'));

        if (p) {
            document.getElementById('prod-title').innerText = p.title;
            document.getElementById('prod-image').src = p.image;
            document.getElementById('prod-price').innerText = "€" + p.price.toFixed(2);
            document.getElementById('prod-specs').innerText = p.specs;
            document.getElementById('prod-content').innerText = p.content;

            const btn = document.getElementById('buy-button');
            btn.setAttribute('data-item-id', p.id);
            btn.setAttribute('data-item-name', p.title);
            btn.setAttribute('data-item-price', p.price);
            btn.setAttribute('data-item-url', window.location.href);
        }

        // Footer laden
        fetch('footer.html').then(r => r.text()).then(d => {
            document.getElementById('footer-placeholder').innerHTML = d;
            lucide.createIcons();
        });
    </script>
</body>
</html>
