<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <div id="header-placeholder"></div>

        <main class="flex-grow p-8" id="product-content">
            <h1 id="prod-title" class="text-4xl font-black uppercase">Laden...</h1>
            </main>

        <div id="footer-placeholder"></div>
    </div>

    <script>
        function loadComponent(id, file) {
            fetch(file)
                .then(r => r.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
            
            // Hier komt je eigen product-fetch logica...
        });
    </script>
</body>
</html>
