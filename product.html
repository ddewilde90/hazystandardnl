<main class="max-w-screen-2xl mx-auto p-4 md:p-12 grid grid-cols-1 md:grid-cols-2 gap-12">
    
    <div class="grid grid-cols-1 gap-4">
        <img id="prod-image" src="" class="w-full border border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
        </div>

    <div class="flex flex-col">
        <h2 class="text-sm font-bold uppercase tracking-widest text-gray-500">Hazy Standard Collectie</h2>
        <h1 id="prod-title" class="text-4xl font-black uppercase tracking-tighter mt-2">Laden...</h1>
        
        <div class="mt-6">
            <span id="prod-price" class="text-3xl font-black text-red-600">€0,00</span>
            <p class="text-xs text-gray-400">Inclusief btw</p>
        </div>

        <button id="buy-button" class="mt-8 snipcart-add-item w-full bg-black text-white py-4 font-bold uppercase hover:bg-gray-800">
            Toevoegen aan mandje
        </button>

        <div class="mt-12 border-t border-black pt-6">
            <div class="flex justify-between py-4 border-b border-gray-200">
                <span class="font-bold uppercase">Materiaal & Wasvoorschrift</span>
                <i data-lucide="chevron-down"></i>
            </div>
            <div id="prod-specs" class="py-4 text-sm text-gray-600">
                </div>
            
            <div class="flex justify-between py-4 border-b border-gray-200">
                <span class="font-bold uppercase">Alles over dit product</span>
                <i data-lucide="chevron-down"></i>
            </div>
            <div id="prod-content" class="py-4 text-sm text-gray-600">
                </div>
        </div>
    </div>
</main>
