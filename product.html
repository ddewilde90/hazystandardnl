<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <header class="border-b border-black">
            <div class="flex justify-between items-center px-4 py-6 border-b border-black">
                <h1 class="text-4xl font-extrabold uppercase tracking-tighter"><a href="index.html">Hazy Standard.</a></h1>
                <a href="#" class="snipcart-checkout flex items-center space-x-2 text-xs font-bold uppercase tracking-widest border border-black px-3 py-2">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Mandje (<span class="snipcart-items-count">0</span>)</span>
                </a>
            </div>
            <nav class="flex flex-wrap overflow-x-auto border-black">
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Home</a>
                <a href="shop.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm bg-black text-white">Shop</a>
                <a href="index.html" class="px-6 py-3 border-black font-semibold uppercase text-sm">Contact</a>
            </nav>
        </header>

        <main class="flex-grow p-12">
            <a href="shop.html" class="text-xs font-bold uppercase underline mb-8 block">&larr; Terug naar Shop</a>
            
            <div class="max-w-4xl">
                <h1 id="prod-title" class="text-5xl font-black uppercase mb-6">Laden...</h1>
                <img id="prod-image" src="" class="w-full h-64 object-cover mb-8 bg-gray-100">
                <p id="prod-intro" class="text-xl italic mb-10 text-gray-600"></p>
                <div id="prod-content" class="prose max-w-none"></div>
                
                <div class="mt-12 pt-12 border-t border-black">
                    <button id="buy-button" class="snipcart-add-item bg-black text-white px-8 py-4 font-bold uppercase">
                        Toevoegen aan mandje
                    </button>
                </div>
            </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <script src="producten.js"></script>
    <script>
        // Vul data in
        const params = new URLSearchParams(window.location.search);
        const p = producten.find(x => x.id === params.get('id'));

        if (p) {
            document.getElementById('prod-title').innerText = p.title;
            document.getElementById('prod-image').src = p.image;
            document.getElementById('prod-intro').innerText = p.intro;
            document.getElementById('prod-content').innerHTML = p.content;
            
            const btn = document.getElementById('buy-button');
            btn.setAttribute('data-item-id', p.id);
            btn.setAttribute('data-item-name', p.title);
            btn.setAttribute('data-item-price', p.price);
            btn.setAttribute('data-item-image', p.image);
            btn.innerText = `Voeg toe aan mandje - €${p.price.toFixed(2)}`;
        }

        // Laad footer en iconen
        fetch('footer.html').then(r => r.text()).then(d => {
            document.getElementById('footer-placeholder').innerHTML = d;
            lucide.createIcons();
        });
    </script>
    <script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="JOUW_KEY"></div>
</body>
</html>
