<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://cdn.snipcart.com" />
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <header class="border-b border-black">
            <div class="flex justify-between items-center px-4 py-6 border-b border-black">
                <h1 class="text-4xl font-extrabold uppercase tracking-tighter"><a href="index.html">Hazy Standard.</a></h1>
                <a href="#" class="snipcart-checkout flex items-center space-x-2 text-xs font-bold uppercase tracking-widest border border-black px-3 py-2 hover:bg-black hover:text-white transition-all cursor-pointer">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Mandje (<span class="snipcart-items-count">0</span>)</span>
                </a>
            </div>
            <nav class="flex flex-wrap overflow-x-auto border-black">
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-50">Home</a>
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-50">Portfolio</a>
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-50">Verhalen</a>
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-50">About me</a>
                <a href="shop.html" class="bg-black text-white px-6 py-3 border-r border-black font-semibold uppercase text-sm">Shop</a>
                <a href="index.html" class="px-6 py-3 border-black font-semibold uppercase text-sm hover:bg-gray-50">Contact</a>
            </nav>
        </header>

        <main class="flex-grow flex flex-col">
            <div class="p-8 md:p-12 border-b border-black bg-white text-black">
                <h1 class="text-[50px] md:text-[100px] font-extrabold uppercase leading-[0.8] tracking-tighter">The <br><span class="italic font-serif font-normal lowercase tracking-normal text-gray-400">Shop</span></h1>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 flex-grow border-b border-black" id="shop-grid">
                <div class="product-card border-r border-b border-black p-8 flex flex-col justify-between" data-category="jewelry">
                    <h3 class="text-2xl font-black uppercase tracking-tighter mt-2">Ocean Jasper Ring</h3>
                    <div class="mt-8 flex justify-between items-end">
                        <span class="text-xl font-black">€1,00</span>
                        <button class="snipcart-add-item bg-black text-white px-4 py-2 text-xs font-bold uppercase"
                            data-item-id="ocean-jasper-ring"
                            data-item-name="Ocean Jasper Handgemaakte Ring"
                            data-item-price="1.00"
                            data-item-url="https://ddewilde90.github.io/hazystandardnl/shop.html"
                            data-item-description="Uniek, handgemaakt design met geselecteerde ruwe Ocean Jasper."
                            data-item-image="/assets/images/ocean-jasper.jpg">
                            + Mandje
                        </button>
                    </div>
                </div>
                </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="JOUW_SNIPCART_API_KEY"></div>

    <script>
        // Laad footer in
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                lucide.createIcons(); // Zorg dat iconen in de footer ook laden
            });
    </script>
</body>
</html>
