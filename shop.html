<script>
    // 1. Fetch de data met betere foutafhandeling
    fetch('producten.json')
        .then(response => {
            if (!response.ok) throw new Error("Kan producten.json niet vinden!");
            return response.json();
        })
        .then(producten => {
            const grid = document.getElementById('product-grid');
            
            if (!producten || producten.length === 0) {
                grid.innerHTML = "<p class='p-8'>Geen producten gevonden.</p>";
                return;
            }

            grid.innerHTML = producten.map(p => `
                <div class="border-r border-b border-black p-8 hover:bg-gray-50">
                    <a href="product.html?id=${p.id}">
                        <img src="${p.image}" class="w-full mb-4" onerror="this.src='fallback.jpg'">
                        <h3 class="text-2xl font-black uppercase tracking-tighter">${p.title || 'Geen naam'}</h3>
                    </a>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-black">€${p.price ? p.price.toFixed(2).replace('.', ',') : '0,00'}</span>
                        <button class="snipcart-add-item bg-black text-white px-4 py-2 text-xs font-bold uppercase"
                            data-item-id="${p.id}"
                            data-item-name="${p.title}"
                            data-item-price="${p.price}"
                            data-item-url="https://ddewilde90.github.io/hazystandardnl/product.html?id=${p.id}">
                            + Mandje
                        </button>
                    </div>
                </div>
            `).join('');
        })
        .catch(err => {
            console.error("Fout:", err);
            document.getElementById('product-grid').innerHTML = `<p class="p-8 text-red-500 font-bold">Fout bij laden: ${err.message}</p>`;
        });

    // Footer laden
    fetch('footer.html').then(r => r.text()).then(d => {
        document.getElementById('footer-placeholder').innerHTML = d;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    });
</script>
