<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <header class="border-b border-black">
            <div class="flex justify-between items-center px-4 py-6 border-b border-black">
                <h1 class="text-4xl font-extrabold uppercase tracking-tighter"><a href="index.html">Hazy Standard.</a></h1>
                <a href="#" class="snipcart-checkout flex items-center space-x-2 text-xs font-bold uppercase tracking-widest border border-black px-3 py-2 hover:bg-black hover:text-white transition-all cursor-pointer">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Mandje (<span class="snipcart-items-count">0</span>)</span>
                </a>
            </div>
            <nav class="flex flex-wrap overflow-x-auto border-black">
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-50">Home</a>
                <a href="shop.html" class="bg-black text-white px-6 py-3 border-r border-black font-semibold uppercase text-sm">Shop</a>
                <a href="index.html" class="px-6 py-3 border-black font-semibold uppercase text-sm hover:bg-gray-50">Contact</a>
            </nav>
        </header>

       <div class="p-4 border-b border-black flex gap-2 overflow-x-auto items-center">
    <select id="filter-cat" class="border border-black rounded-full px-4 py-1 text-xs uppercase font-bold cursor-pointer hover:bg-gray-50">
        <option value="all">Categorie</option>
    </select>
    
    <select id="filter-kleur" class="border border-black rounded-full px-4 py-1 text-xs uppercase font-bold cursor-pointer hover:bg-gray-50">
        <option value="all">Kleur</option>
    </select>
    
    <select id="sort-prijs" class="border border-black rounded-full px-4 py-1 text-xs uppercase font-bold cursor-pointer hover:bg-gray-50">
        <option value="default">Prijs sorteren</option>
        <option value="low-high">Laagste eerst</option>
        <option value="high-low">Hoogste eerst</option>
    </select>

    <button onclick="resetFilters()" class="text-xs underline uppercase font-bold px-4">Alles wissen</button>
</div>

        <main class="flex-grow grid grid-cols-1 md:grid-cols-3" id="product-grid">
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="YzkwMTE0ZjgtNTg2Yi00ZDRiLWJmZjktYjZkNjg2OTAwOTJmNjM5MTY4NjIyNzM2NDU3MTA5" data-currency="eur"></div>

    <script>
        let alleProducten = [];

        async function initShop() {
            const response = await fetch('producten.json');
            alleProducten = await response.json();
            
            vulFilters();
            renderProducten(alleProducten);
        }

        function vulFilters() {
            const cats = [...new Set(alleProducten.map(p => p.category))];
            const mats = [...new Set(alleProducten.map(p => p.material))];
            
            const catSelect = document.getElementById('filter-cat');
            cats.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);
            
            const matSelect = document.getElementById('filter-materiaal');
            mats.forEach(m => matSelect.innerHTML += `<option value="${m}">${m}</option>`);
        }

        function renderProducten(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(p => `
                <div class="border-r border-b border-black p-8 hover:bg-gray-50">
                    <a href="product.html?id=${p.id}">
                        <img src="${p.image}" class="w-full mb-4">
                        <h3 class="text-2xl font-black uppercase tracking-tighter">${p.title}</h3>
                    </a>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-xl font-black">€${p.price.toFixed(2).replace('.', ',')}</span>
                        <button class="snipcart-add-item bg-black text-white px-4 py-2 text-xs font-bold uppercase"
                            data-item-id="${p.id}"
                            data-item-name="${p.title}"
                            data-item-price="${p.price}"
                            data-item-url="https://ddewilde90.github.io/hazystandardnl/product.html?id=${p.id}">
                            + Mandje
                        </button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('filter-cat').addEventListener('change', filter);
        document.getElementById('filter-materiaal').addEventListener('change', filter);

        function filter() {
            const cat = document.getElementById('filter-cat').value;
            const mat = document.getElementById('filter-materiaal').value;
            
            const filtered = alleProducten.filter(p => {
                return (cat === 'all' || p.category === cat) && (mat === 'all' || p.material === mat);
            });
            renderProducten(filtered);
        }

        function resetFilters() {
            document.getElementById('filter-cat').value = 'all';
            document.getElementById('filter-materiaal').value = 'all';
            renderProducten(alleProducten);
        }

        initShop();

        fetch('footer.html').then(r => r.text()).then(d => {
            document.getElementById('footer-placeholder').innerHTML = d;
            lucide.createIcons();
        });
    </script>
</body>
</html>
