<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Hazy Standard | Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">
    <div id="filter-bar" class="p-4 border-b border-black flex gap-4">
        <select id="filter-cat"><option value="all">Categorie</option></select>
        <select id="filter-mat"><option value="all">Materiaal</option></select>
    </div>

    <main id="product-grid" class="grid grid-cols-3 gap-4 p-4"></main>

    <script>
        let alleProducten = [];

        fetch('producten.json')
            .then(res => res.json())
            .then(data => {
                alleProducten = data;
                console.log("Data geladen:", alleProducten); // Check je F12 console!
                
                // Vul categorieën
                const catSelect = document.getElementById('filter-cat');
                [...new Set(data.map(p => p.category))].forEach(c => {
                    catSelect.innerHTML += `<option value="${c}">${c}</option>`;
                });

                render(data);
            });

        function render(items) {
            document.getElementById('product-grid').innerHTML = items.map(p => `
                <div class="border p-4">
                    <h3>${p.title}</h3>
                    <p>€${p.price}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
