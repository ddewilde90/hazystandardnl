<main class="flex-grow">
    <!-- Header sectie -->
    <div class="p-8 md:p-12 border-b border-black bg-white text-black">
        <h1 class="text-[50px] md:text-[100px] font-extrabold uppercase leading-[0.8] tracking-tighter">The <br><span class="italic font-serif font-normal lowercase tracking-normal text-gray-400">Shop</span></h1>
    </div>

    <!-- Shop container: Sidebar + Grid -->
    <div class="flex flex-col md:flex-row min-h-screen">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-64 border-r border-black p-8 bg-gray-50/50">
            <h3 class="font-bold uppercase text-xs tracking-widest mb-6">Filter</h3>
            <ul class="space-y-4">
                <li><a href="#" class="text-sm font-semibold hover:text-gray-500 uppercase">Alles</a></li>
                <li><a href="#" class="text-sm font-semibold hover:text-gray-500 uppercase">Jewelry</a></li>
                <li><a href="#" class="text-sm font-semibold hover:text-gray-500 uppercase">Reports</a></li>
            </ul>
        </aside>

        <!-- Product Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 flex-grow" id="shop-grid">
            
            <div class="product-card border-r border-b border-black p-8 flex flex-col justify-between" data-category="jewelry">
                <h3 class="text-2xl font-black uppercase tracking-tighter mt-2">Ocean Jasper Ring</h3>
                <div class="mt-8 flex justify-between items-end">
                    <span class="text-xl font-black">€1,00</span>
                    <button class="snipcart-add-item bg-black text-white px-4 py-2 text-xs font-bold uppercase hover:bg-gray-800 transition"
                        data-item-id="ocean-jasper-ring"
                        data-item-name="Ocean Jasper Handgemaakte Ring"
                        data-item-price="1.00"
                        data-item-url="https://ddewilde90.github.io/hazystandardnl/shop.html"
                        data-item-description="Uniek, handgemaakt design met geselecteerde ruwe Ocean Jasper.">
                        + Mandje
                    </button>
                </div>
            </div>

            <div class="product-card border-r border-b border-black p-8 flex flex-col justify-between" data-category="jewelry">
                <h3 class="text-2xl font-black uppercase tracking-tighter mt-2">Moldaviet Amulet</h3>
                <div class="mt-8 flex justify-between items-end">
                    <span class="text-xl font-black">€110,00</span>
                    <button class="snipcart-add-item bg-black text-white px-4 py-2 text-xs font-bold uppercase hover:bg-gray-800 transition"
                        data-item-id="moldaviet-amulet"
                        data-item-name="Moldaviet Kosmisch Amulet"
                        data-item-price="110.00"
                        data-item-url="https://ddewilde90.github.io/hazystandardnl/shop.html">
                        + Mandje
                    </button>
                </div>
            </div>

            <div class="product-card border-b border-black p-8 flex flex-col justify-between" data-category="reports">
                <h3 class="text-2xl font-black uppercase tracking-tighter mt-2">Jaaroverzicht 2025</h3>
                <div class="mt-8 flex justify-between items-end">
                    <span class="text-xl font-black">€45,00</span>
                    <button class="snipcart-add-item bg-black text-white px-4 py-2 text-xs font-bold uppercase hover:bg-gray-800 transition"
                        data-item-id="jaaroverzicht-2025"
                        data-item-name="Jaaroverzicht 2025: Data-Industrie"
                        data-item-price="45.00"
                        data-item-url="https://ddewilde90.github.io/hazystandardnl/shop.html">
                        + Mandje
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
