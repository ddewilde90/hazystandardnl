<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Hazy Standard | Shop</title>
    <!-- Snipcart CSS -->
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body>

    <!-- Je winkelwagenknop -->
    <button class="snipcart-checkout">Winkelwagen (<span class="snipcart-items-count">0</span>)</button>

    <!-- Je productknop (test) -->
    <button class="snipcart-add-item"
        data-item-id="test-product"
        data-item-name="Test Product"
        data-item-price="10.00"
        data-item-url="https://ddewilde90.github.io/hazystandardnl/shop.html"
        data-item-description="Dit is een test product.">
        Voeg toe aan mandje
    </button>

    <!-- Snipcart Script & Div -->
    <script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
    <div id="snipcart" data-api-key="JOUW_TEST_API_KEY_HIER" hidden></div>

</body>
</html>
