<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verhalen | Hazy Standard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <header class="border-b border-black p-6 flex justify-between items-center">
            <h1 class="text-4xl font-extrabold uppercase tracking-tighter">Hazy Standard.</h1>
            <nav class="flex gap-6 font-bold uppercase text-sm">
                <a href="index.html" class="hover:underline">Home</a>
                <a href="verhalen.html" class="underline">Verhalen</a>
            </nav>
        </header>

        <main id="blog-grid" class="flex-grow grid grid-cols-1 md:grid-cols-3 border-b border-black">
            </main>

        <footer class="p-8 border-t border-black text-xs font-bold uppercase text-gray-500">
            &copy; 2026 Hazy Standard. Alle rechten voorbehouden.
        </footer>
    </div>

    <script type="module">
        import { data } from './data.js';

        const grid = document.getElementById('blog-grid');
        
        // Zorg dat grid en data bestaan
        if (grid && data && data.analysis) {
            grid.innerHTML = data.analysis.map(item => `
                <article class="border-r border-b border-black p-8 hover:bg-gray-50 transition-colors flex flex-col">
                    <img src="${item.image}" class="w-full h-64 object-cover mb-6 border border-black" alt="${item.title}">
                    
                    <h3 class="text-2xl font-black uppercase tracking-tighter mb-4 leading-tight">
                        ${item.title}
                    </h3>
                    
                    <p class="text-sm text-gray-700 mb-6 flex-grow">
                        ${item.intro}
                    </p>
                    
                    <div class="mt-auto pt-6 border-t border-black flex justify-between items-center">
                        <span class="text-[10px] font-bold uppercase tracking-widest">${item.date}</span>
                        <a href="#" class="text-xs font-bold uppercase underline">Lees verder</a>
                    </div>
                </article>
            `).join('');
            
            // Lucide icons activeren
            if (window.lucide) lucide.createIcons();
        }
    </script>
</body>
</html>
