<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verhalen | Hazy Standard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-white text-black antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <header class="border-b border-black">
            <div class="px-4 py-6 border-b border-black">
                <h1 class="text-4xl font-extrabold uppercase tracking-tighter">Hazy Standard.</h1>
            </div>
            <nav class="flex overflow-x-auto border-black">
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Home</a>
                <a href="verhalen.html" class="bg-black text-white px-6 py-3 border-r border-black font-semibold uppercase text-sm">Verhalen</a>
                <a href="about.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">About me</a>
                <a href="shop.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm">Shop</a>
                <a href="contact.html" class="px-6 py-3 font-semibold uppercase text-sm">Contact</a>
            </nav>
        </header>

        <main id="blog-grid" class="grid grid-cols-1 md:grid-cols-3 border-b border-black">
            </main>
    </div>

    <script type="module">
        import { data } from './data.js';
        
        const grid = document.getElementById('blog-grid');
        
        grid.innerHTML = data.analysis.map(item => `
            <div class="border-r border-b border-black p-8 hover:bg-gray-50 transition-colors flex flex-col">
                <img src="${item.image}" class="w-full h-64 object-cover mb-6 border border-black">
                
                <h3 class="text-2xl font-black uppercase tracking-tighter mb-4 leading-tight">
                    ${item.title}
                </h3>
                
                <p class="text-sm text-gray-700 mb-6 flex-grow">
                    ${item.intro}
                </p>
                
                <div class="mt-auto pt-6 border-t border-black flex justify-between items-center">
                    <span class="text-[10px] font-bold uppercase tracking-widest">${item.date}</span>
                    <a href="#" class="text-xs font-bold uppercase underline">Lees verder</a>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
