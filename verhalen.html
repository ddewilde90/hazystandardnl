<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Verhalen | Hazy Standard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans">
    
    <header class="border-b border-black p-6">
        <h1 class="text-4xl font-black uppercase">Hazy Standard</h1>
    </header>

    <main id="blog-grid" class="grid grid-cols-1 md:grid-cols-3 border-b border-black">
        </main>

    <footer class="p-6 text-xs font-bold uppercase border-t border-black">
        &copy; 2026 Hazy Standard
    </footer>

    <script>
        // GEEN import, GEEN fetch. We definiëren de data hier direct voor de test.
        const articles = [
            { title: "Verhaal 1", intro: "Dit is de intro tekst.", image: "https://via.placeholder.com/400", date: "24 juni 2026" },
            { title: "Verhaal 2", intro: "Nog een verhaal.", image: "https://via.placeholder.com/400", date: "24 juni 2026" }
        ];

        const grid = document.getElementById('blog-grid');
        grid.innerHTML = articles.map(item => `
            <article class="border-r border-b border-black p-8">
                <img src="${item.image}" class="w-full h-64 object-cover mb-6 border border-black">
                <h3 class="text-2xl font-black uppercase mb-4">${item.title}</h3>
                <p class="text-sm text-gray-700 mb-6">${item.intro}</p>
                <div class="pt-6 border-t border-black">
                    <span class="text-[10px] font-bold uppercase">${item.date}</span>
                </div>
            </article>
        `).join('');
    </script>
</body>
</html>
