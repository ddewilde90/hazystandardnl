<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verhalen | Hazy Standard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <div id="header-placeholder"></div>

        <main id="main-content" class="flex-grow">
            <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-3"></div>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <script type="module">
    import { data } from './data.js';
    import * as app from './app.js';

        window.openArticleById = (id) => {
        const article = data.analysis.find(a => a.id === id);
        if (article) {
            app.openArticle(article);
        } else {
            console.error("Artikel niet gevonden met ID:", id);
        }
    };

        async function loadComponent(id, file) {
            const response = await fetch(file);
            document.getElementById(id).innerHTML = await response.text();
            if (window.lucide) lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadComponent('header-placeholder', 'header.html');
            await loadComponent('footer-placeholder', 'footer.html');

            const grid = document.getElementById('blog-grid');
            
            if (data && data.analysis && grid) {
                grid.innerHTML = data.analysis.map(item => `
                    <article class="border-r border-b border-black p-8 hover:bg-gray-50 transition-colors flex flex-col bg-white cursor-pointer group">
                        <img src="${item.image}" class="w-full h-64 object-cover mb-6 border border-black" alt="${item.title}">
                        <h3 class="text-2xl font-black uppercase tracking-tighter mb-4 leading-tight">${item.title}</h3>
                        <p class="text-sm text-gray-700 mb-6 flex-grow">${item.intro}</p>
                        <div class="mt-auto pt-6 border-t border-black flex justify-between items-center">
                            <span class="text-[10px] font-bold uppercase tracking-widest">${item.date}</span>
                            <button onclick="window.openArticleById('${item.id}')" class="text-xs font-bold uppercase underline">Lees verder</button>
                        </div>
                    </article>
                `).join('');
            }
        });

        // Bridge functie om vanuit HTML bij de openArticle functie in apps.js te komen
        window.openArticleById = (id) => {
            const article = data.analysis.find(a => a.id === id);
            if (article) app.openArticle(article); 
        };
    </script>
</body>
</html>
