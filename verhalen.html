<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Verhalen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <div id="header-placeholder"></div>

        <main class="flex-grow">
            <div class="p-8 border-b border-black">
                <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter">Verhalen.</h1>
                <p class="text-sm font-bold text-gray-500 uppercase mt-2">Diepgaande rapportages en feitenonderzoek.</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-0 border-b border-black">
                <div class="p-8 border-b md:border-b-0 md:border-r border-black hover:bg-gray-50 transition-colors">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Analyse</span>
                    <h3 class="text-xl font-bold mt-2 mb-4">De impact van data op de markt</h3>
                    <button class="text-sm font-black uppercase underline">Lees verder</button>
                </div>
                </div>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <script>
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
        });
    </script>
</body>
</html>
