<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazy Standard | Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdn.snipcart.com" />
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body class="bg-white text-black font-sans antialiased">
    <div class="max-w-screen-2xl mx-auto border-x border-black min-h-screen flex flex-col">
        
        <header class="border-b border-black">
            <div class="flex justify-between items-center px-4 py-6 border-b border-black">
                <h1 class="text-4xl font-extrabold uppercase tracking-tighter"><a href="index.html">Hazy Standard.</a></h1>
                <a href="#" class="snipcart-checkout flex items-center space-x-2 text-xs font-bold uppercase tracking-widest border border-black px-3 py-2 hover:bg-black hover:text-white transition-all cursor-pointer">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Mandje (<span class="snipcart-items-count">0</span>)</span>
                </a>
            </div>
            <nav class="flex flex-wrap border-b border-black bg-white overflow-x-auto">
                <a href="index.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-100">Home</a>
                <a href="portfolio.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-100">Portfolio</a>
                <a href="verhalen.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-100">Verhalen</a>
                <a href="about.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-100">About me</a>
                <a href="shop.html" class="bg-black text-white px-6 py-3 border-r border-black font-semibold uppercase text-sm">Shop</a>
                <a href="contact.html" class="px-6 py-3 border-r border-black font-semibold uppercase text-sm hover:bg-gray-100">Contact</a>
            </nav>
        </header>


        <main class="flex-grow grid grid-cols-1 md:grid-cols-3" id="product-grid"></main>

        <!-- Hier worden de footer en nieuwsbrief ingeladen -->
        <div id="nieuwsbrief-placeholder"></div>
        <div id="footer-placeholder"></div>
    </div>

    <script>
        // Functie om bestanden in te laden
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
        }

        // Zodra de pagina is geladen, haal de componenten op
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('nieuwsbrief-placeholder', 'nieuwsbrief.html');
            loadComponent('footer-placeholder', 'footer.html');
        });
    </script>
</body>
</html>
